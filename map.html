<!doctype html><html lang="el"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8f3e35"><link rel="manifest" href="manifest.webmanifest">
<title>Διαδραστικός χάρτης — Roma 2026</title>
<link rel="stylesheet" href="assets/app-v2.css"><link rel="stylesheet" href="assets/app-v4.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
</head><body>
<header class="v4-topbar"><a class="v4-brand" href="index.html"><img src="assets/icons/icon-192.png"><div><strong>Διαδραστικός χάρτης</strong><small>Όλα τα σημεία του ταξιδιού</small></div></a>
<div class="v4-actions"><button id="locateBtn" class="v4-icon-btn" aria-label="Θέση μου">◎</button><button class="v4-icon-btn" data-theme-toggle>◐</button></div></header>
<main class="map-shell">
<div class="map-toolbar">
<button class="active" data-mapcat="all">Όλα</button><button data-mapcat="attraction">🏛️ Αξιοθέατα</button>
<button data-mapcat="food">🍝 Φαγητό</button><button data-mapcat="hotel">🏨 Διαμονή</button>
<button data-mapcat="toilet">🚻 WC</button><button data-mapcat="water">🚰 Νερό</button>
</div>
<div id="realMap"></div>
<p style="color:var(--v4-muted);font-size:12px;padding:8px 4px">Ο χάρτης χρειάζεται internet για τα πλακίδια OpenStreetMap. Τα αποθηκευμένα κείμενα της εφαρμογής λειτουργούν offline.</p>
</main>
<script src="assets/portable-data.js"></script><script src="assets/app-v2.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="assets/map-v4.js"></script><script src="assets/app-v4.js"></script>
</body></html>
